[package]
name = "claude-proxy"
version = "0.12.0"
edition = "2021"
rust-version = "1.89"
description = "Run Claude Code under several accounts: a command per account, quota-aware auto, failover runs"
license = "MIT"
homepage = "https://github.com/ohmaseclaro/claude-proxy"
repository = "https://github.com/ohmaseclaro/claude-proxy"
readme = "README.md"
keywords = ["claude", "claude-code", "anthropic", "multi-account", "quota"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**/*.rs", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md"]

[[bin]]
name = "claude-proxy"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP for the quota lookup: a CLI wants a few synchronous calls, not an
# async runtime. ureq brings rustls, so there is no system OpenSSL.
ureq = { version = "2", features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Profiles link shared dirs as junctions: symlinks need privileges on Windows.
junction = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
# Temp dirs for the hermetic registry/install tests.
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
