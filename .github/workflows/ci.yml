name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all-targets
      - name: build (release)
        run: cargo build --release

  mod:
    name: mod (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install Claude Code
        # Pinned: later releases skip writing the mod types in a logged-out session.
        run: npm i -g @anthropic-ai/claude-code@2.1.288
      - name: validate
        run: |
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate skills --strict
          claude plugin validate mods/proxy-runs --strict
      - name: test
        run: claude plugin test mods/proxy-runs
      - name: types
        # The first line only writes the git-ignored types; "Not logged in" is expected.
        run: |
          HOME="$(mktemp -d)" claude --plugin-dir "$PWD/mods/proxy-runs" -p hi < /dev/null || true
          npx -y -p typescript@5 tsc -p mods/proxy-runs --noEmit
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck hooks/*.sh
